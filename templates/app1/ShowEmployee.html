{% extends 'layout.html' %}

{% block content %}

<h2 class="text-center">SHOW EMPLOYEE</h2>

<table class="table table-bordered table-dark">

    <thead>

    <tr>
        <th>Eid</th>
        <th>Name</th>
        <th>DOB</th>
        <th>Email</th>
        <th>City</th>
        <th>Salary</th>
        <th>Action</th>
    </tr>

    </thead>

    <tbody>

    {% for i in data %}

    <tr>

        <td>{{ i.eid }}</td>
        <td>{{ i.name }}</td>
        <td>{{ i.dob }}</td>
        <td>{{ i.email }}</td>
        <td>{{ i.city }}</td>
        <td>{{ i.salary }}</td>

        <td>

            <a href="{% url 'update_url' i.id %}" class="btn btn-warning btn-sm">UPDATE</a>

            <a href="{% url 'delete_url' i.id %}" class="btn btn-danger btn-sm">DELETE</a>

        </td>

    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
